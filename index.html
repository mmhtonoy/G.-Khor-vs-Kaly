<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>G.Khor VS Kaly — Endless Runner</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111d;font-family:Arial,Helvetica,sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#rotate{position:fixed;inset:0;z-index:5;background:#08111b;color:white;display:none;align-items:center;justify-content:center;text-align:center;pointer-events:none}
#rotate div{font-size:25px;font-weight:900}.small{display:block;font-size:14px;color:#b9c7d6;margin-top:10px}
.layer{position:fixed;inset:0;pointer-events:none}
button{font-family:inherit;border:0;user-select:none;cursor:pointer}
#menu,#pause,#over{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center}
#menu{pointer-events:auto}
#play{position:relative;z-index:40;pointer-events:auto;touch-action:manipulation}
#pause,#over{display:none;background:rgba(0,0,0,.62);backdrop-filter:blur(5px)}
.menuBox{text-align:center;color:#fff;min-width:min(560px,88vw)}
.logo{font-weight:1000;line-height:.78;font-size:clamp(46px,9vw,90px);letter-spacing:-5px;text-shadow:5px 6px 0 #05070a,0 0 30px #000}
.logo .g{color:#ff4d22}.logo .k{color:#1bb4ff}.logo .vs{font-size:.35em;color:#fff;letter-spacing:1px}
.play{margin-top:35px;padding:14px 70px;border-radius:18px;background:linear-gradient(#ffd14b,#ff9e00);font-size:clamp(23px,4vw,35px);font-weight:1000;color:#181818;border:4px solid #5a3500;box-shadow:0 7px 0 #5a3500}
.play:active{transform:translateY(5px);box-shadow:0 2px 0 #5a3500}
.tip{margin-top:18px;font-size:14px;text-shadow:0 2px 4px #000}
.hud{position:fixed;top:10px;left:12px;right:76px;z-index:15;display:none;align-items:center;justify-content:space-between;color:white;font-weight:900;pointer-events:none}
.badge{background:rgba(5,12,19,.78);border:1px solid #ffffff45;border-radius:12px;padding:7px 11px;text-shadow:0 2px 3px #000}
.hleft,.hright{display:flex;gap:8px;align-items:center}.mode{padding:7px 12px;border-radius:12px;background:#07121dcc;border:1px solid #ffffff45}
#pauseBtn{position:fixed;right:10px;top:9px;z-index:20;width:52px;height:52px;border-radius:15px;background:#07121dcc;color:#fff;border:2px solid #ffffff88;font-size:22px;font-weight:1000;display:none}
.controls{position:fixed;inset:0;z-index:20;display:none;pointer-events:none}
#run{position:absolute;left:17px;bottom:16px;width:88px;height:88px;border-radius:50%;background:radial-gradient(circle,#ffca2c,#ff8d00);border:4px solid #fff;color:#111;font-size:15px;font-weight:1000;box-shadow:0 6px 0 #703b00;pointer-events:auto}
#run:active{transform:translateY(4px);box-shadow:0 2px 0 #703b00}
.arrows{position:absolute;right:15px;bottom:16px;display:flex;flex-direction:column;gap:8px;pointer-events:auto}
.arrow{width:66px;height:56px;border-radius:18px;background:#0b1622dd;color:#fff;border:2px solid #ffffffaa;font-size:29px;font-weight:1000}
.arrow:active{transform:scale(.94)}
.card{width:min(430px,86vw);padding:26px;border-radius:24px;background:#0a111bf5;border:1px solid #ffffff33;color:#fff;text-align:center;box-shadow:0 25px 80px #000}
.card h1{margin:0 0 10px;font-size:clamp(32px,6vw,54px)}.card p{color:#dbe4ed;margin:6px 0 18px}
.act{width:100%;padding:12px;border-radius:13px;margin:6px 0;font-size:18px;font-weight:1000}.resume{background:#7dd12b}.retry{background:#ffad16}.menuBtn{background:#e44835;color:white}
.gameOverTitle{color:#ff4a32;text-shadow:3px 3px #000;font-style:italic}
</style>
</head>

<canvas id="c"></canvas>
<div id="rotate"><div><br>Rotate Your Phone <span class="small">.</span></div></div>

<div id="menu" class="layer">
  <div class="menuBox">
    <div class="logo"><span class="g">Gaja Khor</span><br><span class="vs">VS</span><br><span class="k">Kaly</span></div>
    <button id="play" class="play">▶ PLAY</button>
    <div class="tip">🌿 Collect leaves • Kaly-কে এড়িয়ে চলো • ↑ Jump • ↓ Slide • RUN = Boost</div>
  </div>
</div>

<div id="hud" class="hud">
  <div class="hleft"><div class="badge">🌿 <span id="leafText">0</span></div><div class="badge">SCORE <span id="scoreText">0</span></div></div>
  <div class="hright"><div class="badge">HIGH <span id="highText">0</span></div><div class="mode">MODE: <span id="modeText">EASY</span></div></div>
</div>
<button id="pauseBtn">Ⅱ</button>
<div id="controls" class="controls">
  <button id="run">🏃<br>RUN</button>
  <div class="arrows"><button id="up" class="arrow">↑</button><button id="down" class="arrow">↓</button></div>
</div>

<div id="pause"><div class="card"><h1>PAUSED</h1><p>Game Paused </p><button id="resume" class="act resume">▶ RESUME</button><button id="restartP" class="act retry">↻ RESTART</button><button id="menuP" class="act menuBtn">⌂ MENU</button></div></div>

let W=0,H=0,D=1,ground=0;
function resize(){
 W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);
 canvas.width=Math.max(1,Math.floor(W*D));canvas.height=Math.max(1,Math.floor(H*D));
 canvas.style.width=W+"px";canvas.style.height=H+"px";ctx.setTransform(D,0,0,D,0,0);
 document.getElementById("rotate").style.display=W<H?"flex":"none";
}
addEventListener("resize",resize);resize();

const $=id=>document.getElementById(id);
let high=Number(localStorage.getItem("GKhorKalyHigh")||0);
let state="menu",last=0,time=0,world=0,score=0,leafCount=0,speed=4.8,boost=false,sliding=false;
let obstacleTimer=0,leafTimer=0,obstacles=[],leaves=[];
const player={x:0,y:0,vy:0,w:88,h:142,jump:false};

function showMenu(){
 state="menu";boost=false;sliding=false;
 $("menu").style.display="flex";$("pause").style.display="none";$("over").style.display="none";
 $("hud").style.display="none";$("controls").style.display="none";$("pauseBtn").style.display="none";
}
function startGame(){
 if(state==="play") return;
 state="play";last=performance.now();time=0;world=0;score=0;leafCount=0;speed=4.8;boost=false;sliding=false;
 obstacles=[];leaves=[];obstacleTimer=55;leafTimer=18;
 player.w=Math.max(64,Math.min(94,W*.075));player.h=player.w*1.62;player.x=W*.14;player.y=0;player.vy=0;player.jump=false;
 $("menu").style.display="none";$("pause").style.display="none";$("over").style.display="none";
 $("hud").style.display="flex";$("controls").style.display="block";$("pauseBtn").style.display="block";
 $("leafText").textContent="0";$("scoreText").textContent="0";$("highText").textContent=high;
 requestAnimationFrame(loop);
}
function pauseGame(){if(state!=="play")return;state="pause";boost=false;$("pause").style.display="flex"}
function resumeGame(){if(state!=="pause")return;state="play";last=performance.now();$("pause").style.display="none";requestAnimationFrame(loop)}
function endGame(){
 state="over";boost=false;sliding=false;
 const s=Math.floor(score);if(s>high){high=s;localStorage.setItem("GKhorKalyHigh",String(high))}
 $("finalScore").textContent=s;$("finalHigh").textContent=high;$("over").style.display="flex";$("pauseBtn").style.display="none";
}
$("play").onclick=startGame;
$("play").addEventListener("pointerup",function(e){e.preventDefault();if(state==="menu")startGame()},{passive:false});
$("resume").onclick=resumeGame;$("restartP").onclick=startGame;$("retry").onclick=startGame;$("menuP").onclick=showMenu;$("menuO").onclick=showMenu;$("pauseBtn").onclick=pauseGame;

function pressHold(el,on,off){
 el.addEventListener("pointerdown",e=>{e.preventDefault();on()}, {passive:false});
 el.addEventListener("pointerup",e=>{e.preventDefault();off()}, {passive:false});
 el.addEventListener("pointercancel",off);el.addEventListener("pointerleave",off);
}
pressHold($("up"),()=>jump(),()=>{});
pressHold($("down"),()=>{sliding=true},()=>{sliding=false});
pressHold($("run"),()=>{boost=true},()=>{boost=false});
addEventListener("keydown",e=>{
 if(["ArrowUp","w","W"," "].includes(e.key)){e.preventDefault();jump()}
 if(["ArrowDown","s","S"].includes(e.key)){e.preventDefault();sliding=true}
 if(["Shift","d","D"].includes(e.key)){boost=true}
 if(e.key.toLowerCase()==="p"){if(state==="play")pauseGame();else if(state==="pause")resumeGame()}
});
addEventListener("keyup",e=>{
 if(["ArrowDown","s","S"].includes(e.key))sliding=false;
 if(["Shift","d","D"].includes(e.key))boost=false;
});
function jump(){
 if(state!=="play")return;
 if(!player.jump&&player.y<=0.1){player.vy=14.8;player.jump=true}
}
function rounded(x,y,w,h,r,fill){
 ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()
}
function drawBackground(){
 ground=H*.78;
 const g=ctx.createLinearGradient(0,0,0,ground);g.addColorStop(0,"#5fb5ef");g.addColorStop(.62,"#f8c06b");g.addColorStop(1,"#e08b4e");
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // sun
 ctx.globalAlpha=.22;ctx.fillStyle="#fff8ce";ctx.beginPath();ctx.arc(W*.78,H*.20,60,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
 // clouds, parallax
 for(let i=0;i<6;i++){
   let xx=((i*230-world*.035)%(W+260)+W+260)%(W+260)-130, yy=60+(i%3)*48;
   ctx.fillStyle="rgba(255,255,255,.58)";
   ctx.beginPath();ctx.arc(xx,yy,18,0,7);ctx.arc(xx+25,yy-8,26,0,7);ctx.arc(xx+53,yy,18,0,7);ctx.fill();
 }
 // distant hills
 ctx.fillStyle="#a66b58";ctx.beginPath();ctx.moveTo(0,ground);
 for(let i=0;i<=W+100;i+=90)ctx.lineTo(i,ground-55-Math.sin(i*.014+world*.0007)*30);
 ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
 // trees/cacti
 for(let i=0;i<8;i++){
   const xx=((i*180-world*.10)%(W+240)+W+240)%(W+240)-100;
   ctx.fillStyle="#2f7148";ctx.fillRect(xx,ground-62,9,62);
   ctx.beginPath();ctx.arc(xx+4,ground-72,30,0,7);ctx.fill();
 }
 ctx.fillStyle="#6c4838";ctx.fillRect(0,ground,W,H-ground);
 for(let xx=-(world%80);xx<W;xx+=80){ctx.fillStyle="#9a6346";ctx.fillRect(xx,ground+9,45,5)}
 // speed streaks in hard mode
 if(score>=1500){ctx.strokeStyle="rgba(255,255,255,.18)";ctx.lineWidth=2;for(let i=0;i<9;i++){let yy=ground-90-i*24;let xx=(i*150-world*.7)%W;ctx.beginPath();ctx.moveTo(xx,yy);ctx.lineTo(xx+55,yy);ctx.stroke()}}
}
function drawSprite(img,dx,dy,dw,dh,flip=false,tilt=0){
  ctx.save();ctx.translate(dx+dw/2,dy+dh);ctx.rotate(tilt);ctx.translate(-(dx+dw/2),-(dy+dh));
  if(flip){ctx.translate(dx+dw,0);ctx.scale(-1,1);dx=0;}
  if(img.complete && img.naturalWidth>0) ctx.drawImage(img,dx,dy,dw,dh);
  ctx.restore();
}
function drawPlayer(){
 const h=sliding?player.h*.62:player.h, w=sliding?player.w*1.28:player.w, y=ground-player.y-h;
 const phase=Math.sin(time*.30);
 ctx.fillStyle="rgba(0,0,0,.25)";ctx.beginPath();ctx.ellipse(player.x+w/2,ground+5,w*.54,7,0,0,7);ctx.fill();
 drawSprite(gkhorImg,player.x,y,w,h,false,phase*.018);
}
function drawEnemy(o){
 ctx.fillStyle="rgba(0,0,0,.25)";ctx.beginPath();ctx.ellipse(o.x+o.w/2,ground+5,o.w*.50,7,0,0,7);ctx.fill();
 drawSprite(kalyImg,o.x,ground-o.h,o.w,o.h,false,Math.sin(time*.20)*.012);
}
function drawLeaf(l){
 ctx.save();ctx.translate(l.x,l.y);ctx.rotate(Math.sin(time*.09+l.r)*.15);ctx.shadowColor="#8cff69";ctx.shadowBlur=12;ctx.font="34px serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("🌿",0,0);ctx.restore()
}
function update(dt){
 const f=dt*60;
 if(state!=="play")return;
 time+=f;world+=speed*f;score+=speed*.065*f;
 // Easy -> Medium -> Hard, with smooth acceleration
 let target;
 if(score<500)target=4.8+score/500*1.7;
 else if(score<1500)target=6.5+(score-500)/1000*2.1;
 else target=8.6+Math.min(3.2,(score-1500)/2200*3.2);
 if(boost)target+=2.8;
 speed+=(target-speed)*.028*f;
 $("scoreText").textContent=Math.floor(score);$("highText").textContent=high;
 const mode=score<500?"EASY":score<1500?"MEDIUM":"HARD";$("modeText").textContent=mode;
 $("modeText").style.color=mode==="EASY"?"#75df39":mode==="MEDIUM"?"#ffd13a":"#ff4c3d";
 player.vy-=.72*f;player.y+=player.vy*f;if(player.y<=0){player.y=0;player.vy=0;player.jump=false}
 obstacleTimer-=f;
 if(obstacleTimer<=0){
   const ew=Math.max(52,player.w*.64),eh=player.h*.72; // intentionally smaller than player
   obstacles.push({x:W+35,w:ew,h:eh});
   obstacleTimer=Math.max(48,82+Math.random()*65-score*.012);
 }
 leafTimer-=f;
 if(leafTimer<=0){leaves.push({x:W+25,y:ground-(50+Math.random()*120),r:Math.random()*8});leafTimer=28+Math.random()*35}
 obstacles.forEach(o=>o.x-=speed*f);leaves.forEach(l=>l.x-=speed*f);
 obstacles=obstacles.filter(o=>o.x>-100);leaves=leaves.filter(l=>l.x>-70);
 const ph=sliding?player.h*.62:player.h,pw=sliding?player.w*1.28:player.w;
 const p={x:player.x+pw*.23,y:ground-player.y-ph+ph*.10,w:pw*.54,h:ph*.78};
 for(const o of obstacles){
   const q={x:o.x+o.w*.20,y:ground-o.h+o.h*.10,w:o.w*.60,h:o.h*.78};
   if(p.x<q.x+q.w&&p.x+p.w>q.x&&p.y<q.y+q.h&&p.y+p.h>q.y){endGame();return}
 }
 for(let i=leaves.length-1;i>=0;i--){
   const l=leaves[i];if(Math.hypot(player.x+pw/2-l.x,(ground-player.y-ph/2)-l.y)<Math.max(27,pw*.5)){leafCount++;score+=18;leaves.splice(i,1);$("leafText").textContent=leafCount}
 }
}
function render(){
 drawBackground();for(const l of leaves)drawLeaf(l);for(const o of obstacles)drawEnemy(o);drawPlayer();
}
function loop(now){
 if(!last)last=now;const dt=Math.min(.032,(now-last)/1000);last=now;update(dt);render();
 if(state==="play"||state==="pause")requestAnimationFrame(loop);
}
source.onload=()=>{ render(); };
source.onerror=()=>{ render(); };

// Start the canvas immediately with safe placeholders.
// The game itself starts only when PLAY is pressed.
try { render(); } catch(e) { console.log("Initial render recovered:",e); }
